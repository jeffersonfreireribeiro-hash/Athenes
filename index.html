<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Athenes — Editor de Relatórios e Artigos Científicos</title>
  <link rel="icon" type="image/svg+xml" href="src/ui/athenes_logo.svg">
  <meta name="theme-color" content="#314F79">
  <meta name="description" content="Ambiente completo para escrever e diagramar relatórios, artigos científicos e documentos acadêmicos em blocos.">

  <!-- Folhas de Estilo Athenes (Soft UI + Nunito + Clux.js) -->
  <link rel="stylesheet" href="src/css/athenes_base.css">
  <link rel="stylesheet" href="src/css/athenes_dashboard.css">
  <link rel="stylesheet" href="src/css/athenes_editor.css">
  <link rel="stylesheet" href="src/css/athenes_paineis.css">
  <link rel="stylesheet" href="src/css/athenes_zotero.css">
</head>
<body>
  <div id="athenesAppRoot"></div>

  <script type="module">
    import { AthenesApp } from './src/ui/athenes_app.js';
    import { carregarFontesImportadas } from './src/ui/athenes_fontes_ui.js';
    window.addEventListener('DOMContentLoaded', async () => {
      // fontes importadas pelo usuário (ex.: Aptos) precisam existir antes do primeiro desenho dos documentos
      try { await Promise.race([carregarFontesImportadas(), new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
      const root = document.getElementById('athenesAppRoot');
      window.athenesApp = new AthenesApp(root);
    });
  </script>
</body>
</html>
